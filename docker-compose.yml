services:
  db:
    # PostgreSQL 16 có sẵn extension pgvector (dùng chung dữ liệu cũ của postgres:16)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: bible
      POSTGRES_DB: bible
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d bible"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bible:bible@db:5432/bible
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - hf-cache:/root/.cache/huggingface  # giữ mô hình đã tải, không tải lại khi build lại
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
